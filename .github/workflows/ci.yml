name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: La versión tiene su entrada en CHANGELOG.md
        run: |
          version=$(node -p "require('./package.json').version")
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::Falta '## [$version]' en CHANGELOG.md"; exit 1; }

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prodash:ci .
