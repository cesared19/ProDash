# Uso: docker compose up -d --build
# La configuración (Jira, contraseña) se lee de .env, igual que sin Docker.
services:
  prodash:
    build: .
    image: prodash:local
    env_file: .env
    environment:
      # Dentro del contenedor siempre escucha en 3100; PORT de .env elige el puerto del servidor.
      PORT: 3100
    ports:
      - "${PORT:-3100}:3100"
    volumes:
      # Saved views (views.json). Kept across updates and rebuilds.
      - prodash-data:/app/data
    restart: unless-stopped

volumes:
  prodash-data:
